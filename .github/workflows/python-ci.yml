name: pipeline

on:
  pull_request:
    paths: ["src/**", "tests/**", "requirements.txt", ".github/workflows/python-ci.yml"]
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "requirements.txt", ".github/workflows/python-ci.yml"]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history, because tests/test_prediction_integrity.py audits every
      # version of every committed prediction. A shallow clone would skip the
      # one test that proves the track record was never edited after the fact.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      # tests/conftest.py refuses any outbound connection, so a test that
      # reaches for Jolpica or the F1 timing API fails instead of spending a
      # shared rate limit. tests/test_no_network.py proves the guard works.
      - name: Test
        run: pytest -q

      # The real data/processed is 43MB and gitignored, so the suite runs
      # against tests/fixtures/processed -- one complete season, rebuildable
      # with tests/fixtures/build_fixture.py. Checks that need seasons the
      # fixture omits report as not applicable rather than disappearing.
      - name: Validate the committed fixture
        run: python src/validate.py --data tests/fixtures/processed
