<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Sector 4">
  <!--
    Four timing bars: three sectors plus the one this project is named for.
    Hex values are literal because a favicon is fetched on its own and cannot
    reach the stylesheet's tokens. They mirror --colour-surface-dark,
    --colour-muted and --colour-action.
  -->
  <rect width="32" height="32" rx="7" fill="#0a0b0d"/>
  <g fill="#6f757e">
    <rect x="6" y="9" width="4" height="14" rx="1.5"/>
    <rect x="12" y="9" width="4" height="14" rx="1.5"/>
    <rect x="18" y="9" width="4" height="14" rx="1.5"/>
  </g>
  <rect x="24" y="9" width="4" height="14" rx="1.5" fill="#6d28d9"/>
</svg>
